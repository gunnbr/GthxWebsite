name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Test the API
        run: dotnet test GthxWebsite.slnx --configuration Release

      - name: Check the Bicep
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          BUDGET_CONTACT_EMAIL=ci@example.com az bicep build-params --file infra/main.bicepparam --stdout > /dev/null

      # The site has no build step; this only catches syntax errors in its scripts.
      - name: Check the site's scripts
        run: |
          node --check site/assets/site.js
          node --check site/assets/admin.js
