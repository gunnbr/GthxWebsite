<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
  <head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>GThx Statistics</title>
    <link href="./layout.css" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="bootstrap.min.css">
    <script type="text/javascript" src="/jquery.js"></script>
    <script type="text/javascript" src="/jquery.tablesorter.js"></script>
    <script type="text/javascript" src="/stats.js"></script>
  </head>
  <body>

    <div class="container">
    <header class="jumbotron masthead" id="overview">
      <div class="inner">
        <div class="container">
	  <h1>GThx Statistics</h1>
	</div>
      </div>
    </header>
      
    <div id="main">
      <h2>Factoid References</h2>
      <table class="bordered-table zebra-striped tablesorter" id="factoidTable">
	<thead>
	  <tr>
	    <th>Factoid</th>
	    <th>Count</th>
	  </tr>
	  </thead>
	<tbody id="factoidResults">
	  <tr class="loading">
	    <td colspan="2">
	    </td>
	  </tr>
	</tbody>
      </table>
      <p></p>
      <h2>Thingiverse References</h2>
      <table class="bordered-table zebra-striped tablesorter" id="thingiverseTable">
	<thead>
	  <tr>
	    <th>Thingiverse ID</th>
	    <th>Count</th>
	  </tr>
	  </thead>
	<tbody id="thingiverseResults">
	  <tr class="loading">
	    <td colspan="2">
	    </td>
	  </tr>
	</tbody>
      </table>
    </div>
    </div>
</body>
</html>
